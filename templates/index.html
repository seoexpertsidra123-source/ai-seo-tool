<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Content Toolkit</title>

    Try Free AI Content Generator →

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #fff;
}

/* HEADER */
.header {
    text-align: center;
    padding: 30px 20px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.header p {
    color: #94a3b8;
}

/* CONTAINER */
.container {
    max-width: 900px;
    margin: 20px auto;
    background: #111827;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

/* TABS */
.tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.tabs button {
    padding: 10px 15px;
    border: none;
    background: #1f2937;
    color: #cbd5f5;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.tabs button.active {
    background: #3b82f6;
    color: white;
}

.tabs button:hover {
    background: #2563eb;
}

/* TEXTAREA */
textarea {
    width: 100%;
    height: 160px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #0f172a;
    color: white;
    font-size: 14px;
}

/* BUTTON */
.generate {
    margin-top: 15px;
    padding: 12px 22px;
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s;
}

.generate:hover {
    opacity: 0.9;
}

/* OUTPUT */
.output {
    margin-top: 25px;
    background: #0f172a;
    padding: 20px;
    border-radius: 12px;
    min-height: 120px;
    white-space: pre-wrap;
}

/* COPY BUTTON */
.copy-btn {
    margin-top: 10px;
    padding: 8px 12px;
    background: #374151;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
}

/* LOADING */
.loading {
    display: none;
    margin-top: 10px;
    color: #94a3b8;
    font-size: 14px;
}
</style>

<script>
function setMode(mode) {
    document.getElementById("mode").value = mode;

    let buttons = document.querySelectorAll(".tabs button");
    buttons.forEach(btn => btn.classList.remove("active"));

    document.getElementById(mode).classList.add("active");
}

function showLoading() {
    document.getElementById("loading").style.display = "block";
}

function copyText() {
    let text = document.getElementById("outputText").innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
}
</script>

</head>

<body>

<div class="header">
    <h1>🚀 AI Content Toolkit</h1>
    <p>Generate SEO content, humanize AI text, detect AI, and more</p>
</div>

<div class="container">

```
<div class="tabs">
    <button id="seo" class="active" onclick="setMode('seo')">SEO</button>
    <button id="humanize" onclick="setMode('humanize')">Humanize</button>
    <button id="detect" onclick="setMode('detect')">Detect AI</button>
    <button id="count" onclick="setMode('count')">Word Count</button>
    <button id="image" onclick="setMode('image')">Image</button>
</div>

<form method="POST" onsubmit="showLoading()">
    <input type="hidden" name="mode" id="mode" value="seo">

    <textarea name="prompt" placeholder="Enter your content here..."></textarea>

    <br>
    <button class="generate" type="submit">Generate</button>

    <p id="loading" class="loading">⏳ Generating content...</p>
</form>

<div class="output" id="outputText">
    {% if response %}
        {{ response }}
    {% else %}
        <span style="color:#64748b;">Your generated content will appear here...</span>
    {% endif %}
</div>

<button class="copy-btn" onclick="copyText()">Copy Output</button>
```
    <a href="/ai-content-generator" style="color:#60a5fa;">Free AI Content Generator</a>
    <a href="/humanize-ai-text" style="color:#38bdf8;">Humanize AI Text Tool</a>

</div>

</body>
</html>
