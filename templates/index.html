<!DOCTYPE html>

<html>
<head>
<title>AI Content Toolkit</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
}

.container {
    max-width: 900px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
    margin-bottom: 20px;
}

.tabs {
    margin-bottom: 15px;
}

.tabs button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    background: #e0e0e0;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.tabs button.active {
    background: #222;
    color: white;
}

textarea {
    width: 100%;
    height: 150px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-top: 10px;
    font-size: 14px;
}

button.generate {
    margin-top: 15px;
    padding: 12px 20px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

button.generate:hover {
    background: #0056b3;
}

.output {
    margin-top: 20px;
    padding: 15px;
    background: #f1f1f1;
    border-radius: 8px;
    min-height: 120px;
    white-space: pre-wrap;
}

.loading {
    display: none;
    margin-top: 10px;
    color: #555;
}
</style>

<script>
function setMode(mode) {
    document.getElementById("mode").value = mode;

    let buttons = document.querySelectorAll(".tabs button");
    buttons.forEach(btn => btn.classList.remove("active"));

    document.getElementById(mode).classList.add("active");
}

function showLoading() {
    document.getElementById("loading").style.display = "block";
}
</script>

</head>

<body>

<div class="container">
    <h1>🚀 AI Content Toolkit</h1>

```
<div class="tabs">
    <button id="seo" class="active" onclick="setMode('seo')">SEO</button>
    <button id="humanize" onclick="setMode('humanize')">Humanize</button>
    <button id="detect" onclick="setMode('detect')">Detect AI</button>
    <button id="count" onclick="setMode('count')">Word Count</button>
    <button id="image" onclick="setMode('image')">Image</button>
</div>

<form method="POST" onsubmit="showLoading()">
    <input type="hidden" name="mode" id="mode" value="seo">

    <textarea name="prompt" placeholder="Enter your content..."></textarea>

    <br>
    <button class="generate" type="submit">Generate</button>

    <p id="loading" class="loading">⏳ Generating content...</p>
</form>

<div class="output">
    {{ response }}
</div>
```

</div>

</body>
</html>
