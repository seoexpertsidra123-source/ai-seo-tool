<!DOCTYPE html>

<html>
<head>
<title>BuildContent AI</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1e293b, #020617);
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#020617;
}

.navbar a {
    color:white;
    text-decoration:none;
    margin-left:20px;
}

/* CHAT AREA */
.chat-container {
    max-width:800px;
    margin:20px auto 120px;
    padding:20px;
}

/* MESSAGE */
.message {
    padding:15px;
    margin:10px 0;
    border-radius:15px;
    max-width:75%;
    animation:fadeIn 0.3s ease;
}

.user {
    background:#7c3aed;
    margin-left:auto;
}

.bot {
    background:#0f172a;
}

/* INPUT */
.input-box {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:800px;
    max-width:90%;
    background:#0f172a;
    border-radius:40px;
    padding:10px;
    display:flex;
}

textarea {
    flex:1;
    background:transparent;
    border:none;
    color:white;
    padding:15px;
    outline:none;
    resize:none;
}

/* BUTTON */
button {
    background:#7c3aed;
    border:none;
    color:white;
    padding:12px;
    border-radius:50%;
    cursor:pointer;
}

/* SUGGESTIONS */
.suggestions {
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:10px;
}

.suggestions button {
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:20px;
    padding:8px 14px;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}
</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">
    <div>🚀 BuildContent AI</div>

```
<div>
    <a href="/ai-content-generator">AI Writer</a>
    <a href="/humanize-ai-text">Humanize</a>
    <a href="/ai-detector-free">Detector</a>
    <a href="/free-seo-writer">SEO</a>
</div>
```

</div>

<!-- CHAT -->

<div class="chat-container" id="chat"></div>

<!-- INPUT -->

<div class="input-box">
<textarea id="input" placeholder="Ask anything..."></textarea>
<button onclick="sendMessage()">↑</button>
</div>

<!-- SUGGESTIONS -->

<div class="suggestions">
    <button onclick="quick('Write SEO article about digital marketing')">SEO</button>
    <button onclick="quick('Do keyword research for fitness niche')">Keywords</button>
    <button onclick="quick('Write Instagram caption for travel')">Caption</button>
    <button onclick="quick('Generate blog ideas for tech')">Ideas</button>
</div>

<script>

// LOAD HISTORY
window.onload = function() {
    let history = JSON.parse(localStorage.getItem("chat_home")) || [];
    history.forEach(msg => addMessage(msg.text, msg.type));
}

// ADD MESSAGE
function addMessage(text, type) {
    let div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
}

// SEND MESSAGE
function sendMessage() {
    let input = document.getElementById("input").value;

    if (!input) return;

    addMessage(input, "user");

    save(input, "user");

    // Fake typing animation
    setTimeout(() => {
        let reply = "Processing your request... Please open AI Writer for full results.";
        addMessage(reply, "bot");
        save(reply, "bot");
    }, 600);

    document.getElementById("input").value = "";
}

// QUICK BUTTON
function quick(text) {
    document.getElementById("input").value = text;
}

// SAVE HISTORY
function save(text, type) {
    let history = JSON.parse(localStorage.getItem("chat_home")) || [];
    history.push({text, type});
    localStorage.setItem("chat_home", JSON.stringify(history));
}

</script>

</body>
</html>
