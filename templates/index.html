<!DOCTYPE html>

<html>
<head>
<title>BuildContent AI</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1e293b, #020617);
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#020617;
}

.navbar a {
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
}

/* CENTER */
.wrapper {
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:85vh;
    text-align:center;
}

h1 {
    font-size:48px;
    margin-bottom:10px;
}

.subtitle {
    color:#94a3b8;
    margin-bottom:30px;
}

/* CHAT BOX */
.chat-box {
    width:650px;
    max-width:90%;
    background:#0f172a;
    border-radius:40px;
    padding:10px;
    display:flex;
    align-items:center;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

textarea {
    flex:1;
    background:transparent;
    border:none;
    color:white;
    padding:15px;
    outline:none;
    resize:none;
    font-size:14px;
}

/* BUTTON */
button {
    background:#7c3aed;
    border:none;
    color:white;
    padding:14px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
}

/* SUGGESTIONS */
.suggestions {
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}

.suggestions button {
    background:#0f172a;
    border:1px solid #1e293b;
    color:white;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
    transition:0.3s;
}

.suggestions button:hover {
    background:#7c3aed;
}
</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">
    <div>🚀 BuildContent AI</div>

```
<div>
    <a href="/ai-content-generator">AI Writer</a>
    <a href="/humanize-ai-text">Humanize</a>
    <a href="/ai-detector-free">Detector</a>
    <a href="/free-seo-writer">SEO</a>
</div>
```

</div>

<!-- MAIN -->

<div class="wrapper">

<h1>BuildContent AI</h1>
<p class="subtitle">All-in-one AI writing platform</p>

<form action="/ai-content-generator" method="GET">

<div class="chat-box">
<textarea id="promptBox" placeholder="Ask anything..."></textarea>
<button>↑</button>
</div>

</form>

<!-- SUGGESTIONS -->

<div class="suggestions">
    <button onclick="setPrompt('Write SEO article about digital marketing')">SEO Article</button>
    <button onclick="setPrompt('Do keyword research for fitness niche')">Keyword Research</button>
    <button onclick="setPrompt('Write Instagram caption for travel')">Social Caption</button>
    <button onclick="setPrompt('Generate blog ideas for tech')">Blog Ideas</button>
</div>

</div>

<!-- SCRIPT -->

<script>
function setPrompt(text) {
    document.getElementById("promptBox").value = text;
}
</script>

</body>
</html>
