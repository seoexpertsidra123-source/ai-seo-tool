</div>

<script>

let chats = JSON.parse(localStorage.getItem("all_chats")) || {};
let currentChat = "chat_" + Date.now();

// LOAD HISTORY LIST
function loadHistory() {
    let historyDiv = document.getElementById("history");
    historyDiv.innerHTML = "";

    Object.keys(chats).forEach(id => {
        let btn = document.createElement("div");
        btn.innerText = "Chat";
        btn.style.padding = "8px";
        btn.style.cursor = "pointer";

        btn.onclick = () => switchChat(id);
        historyDiv.appendChild(btn);
    });
}

// SWITCH CHAT
function switchChat(id) {
    currentChat = id;
    document.getElementById("chat").innerHTML = "";

    chats[id].forEach(msg => {
        addMessage(msg.text, msg.type);
    });
}

// NEW CHAT
function newChat() {
    currentChat = "chat_" + Date.now();
    chats[currentChat] = [];
    document.getElementById("chat").innerHTML = "";
    saveChats();
    loadHistory();
}

// ADD MESSAGE
function addMessage(text, type) {
    let div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
}

// SEND MESSAGE
async function sendMessage() {
    let input = document.getElementById("input");
    let text = input.value;

    if (!text) return;

    addMessage(text, "user");

    chats[currentChat] = chats[currentChat] || [];
    chats[currentChat].push({text, type:"user"});

    input.value = "";

    let typing = document.createElement("div");
    typing.className = "message bot";
    typing.innerText = "Typing...";
    typing.id = "typing";
    document.getElementById("chat").appendChild(typing);

    let res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message:text})
    });

    let data = await res.json();

    document.getElementById("typing").remove();

    addMessage(data.reply, "bot");

    chats[currentChat].push({text:data.reply, type:"bot"});

    saveChats();
}

// SAVE
function saveChats() {
    localStorage.setItem("all_chats", JSON.stringify(chats));
}

// INIT
window.onload = function() {
    if (Object.keys(chats).length === 0) {
        newChat();
    } else {
        currentChat = Object.keys(chats)[0];
        switchChat(currentChat);
    }
    loadHistory();
}

</script>

</body>

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;

/* CHAT AREA */
.chat-container {
    max-width:800px;

/* MESSAGE */
.message {
    padding:15px;

    border-radius:15px;
    max-width:75%;
    animation:fadeIn 0.3s ease;
}

.user {
    background:#7c3aed;

/* INPUT */
.input-box {
    position:fixed;
    bottom:20px;
    left:50%;

    width:800px;
    max-width:90%;

button {

    margin-bottom:80px;
}

.suggestions button {
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:20px;
    padding:8px 14px;
    cursor:pointer;
}

/* ANIMATION */
@keyframes fadeIn {

</head>

<body>

<div class="navbar">
    🚀 BuildContent AI
</div>

<div class="chat-container" id="chat"></div>

<div class="suggestions">
    <button onclick="quick('Write SEO article about digital marketing')">SEO</button>
    <button onclick="quick('Keyword research for fitness niche')">Keywords</button>
    <button onclick="quick('Instagram caption for travel')">Caption</button>
    <button onclick="quick('Blog ideas for tech')">Ideas</button>
</div>

<div class="input-box">
<textarea id="input" placeholder="Ask anything..."></textarea>
<button onclick="sendMessage()">↑</button>
</div>

<script>

// ADD MESSAGE
function addMessage(text, type) {
    let div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
}

// SEND MESSAGE
async function sendMessage() {
    let input = document.getElementById("input");
    let text = input.value;

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    // typing indicator
    let typing = document.createElement("div");
    typing.className = "message bot";
    typing.innerText = "Typing...";
    typing.id = "typing";
    document.getElementById("chat").appendChild(typing);

    let response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message: text })
    });

    let data = await response.json();

    document.getElementById("typing").remove();

    addMessage(data.reply, "bot");
}

// QUICK BUTTON
function quick(text) {
    document.getElementById("input").value = text;
}

</script>

</body>
