<!DOCTYPE html>

<html>
<head>
<title>BuildContent AI</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1e293b, #020617);
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#020617;
}

/* CHAT AREA */
.chat-container {
    max-width:800px;
    margin:20px auto 120px;
    padding:20px;
}

/* MESSAGE */
.message {
    padding:15px;
    margin:10px 0;
    border-radius:15px;
    max-width:75%;
    animation:fadeIn 0.3s ease;
}

.user {
    background:#7c3aed;
    margin-left:auto;
}

.bot {
    background:#0f172a;
}

/* INPUT */
.input-box {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:800px;
    max-width:90%;
    background:#0f172a;
    border-radius:40px;
    padding:10px;
    display:flex;
}

textarea {
    flex:1;
    background:transparent;
    border:none;
    color:white;
    padding:15px;
    outline:none;
    resize:none;
}

/* BUTTON */
button {
    background:#7c3aed;
    border:none;
    color:white;
    padding:12px;
    border-radius:50%;
    cursor:pointer;
}

/* SUGGESTIONS */
.suggestions {
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:80px;
}

.suggestions button {
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:20px;
    padding:8px 14px;
    cursor:pointer;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}
</style>

</head>

<body>

<div class="navbar">
    🚀 BuildContent AI
</div>

<div class="chat-container" id="chat"></div>

<div class="suggestions">
    <button onclick="quick('Write SEO article about digital marketing')">SEO</button>
    <button onclick="quick('Keyword research for fitness niche')">Keywords</button>
    <button onclick="quick('Instagram caption for travel')">Caption</button>
    <button onclick="quick('Blog ideas for tech')">Ideas</button>
</div>

<div class="input-box">
<textarea id="input" placeholder="Ask anything..."></textarea>
<button onclick="sendMessage()">↑</button>
</div>

<script>

// ADD MESSAGE
function addMessage(text, type) {
    let div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
}

// SEND MESSAGE
async function sendMessage() {
    let input = document.getElementById("input");
    let text = input.value;

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    // typing indicator
    let typing = document.createElement("div");
    typing.className = "message bot";
    typing.innerText = "Typing...";
    typing.id = "typing";
    document.getElementById("chat").appendChild(typing);

    let response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message: text })
    });

    let data = await response.json();

    document.getElementById("typing").remove();

    addMessage(data.reply, "bot");
}

// QUICK BUTTON
function quick(text) {
    document.getElementById("input").value = text;
}

</script>

</body>
</html>
