<!DOCTYPE html>

<html>
<head>
<title>BuildContent AI</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1e293b, #020617);
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#020617;
}

.navbar a {
    color:white;
    text-decoration:none;
    margin-left:20px;
}

/* CENTER */
.wrapper {
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:85vh;
    text-align:center;
}

h1 {
    font-size:48px;
}

.subtitle {
    color:#94a3b8;
    margin-bottom:40px;
}

/* CHAT BOX */
.chat-box {
    width:650px;
    max-width:90%;
    background:#0f172a;
    border-radius:40px;
    padding:10px;
    display:flex;
    align-items:center;
}

textarea {
    flex:1;
    background:transparent;
    border:none;
    color:white;
    padding:15px;
    outline:none;
    resize:none;
}

/* BUTTON */
button {
    background:#7c3aed;
    border:none;
    color:white;
    padding:14px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}
</style>

</head>

<body>

<div class="navbar">
    <div>🚀 BuildContent AI</div>

```
<div>
    <a href="/ai-content-generator">AI Writer</a>
    <a href="/humanize-ai-text">Humanize</a>
    <a href="/ai-detector-free">Detector</a>
    <a href="/free-seo-writer">SEO</a>
</div>
```

</div>

<div class="wrapper">

<h1>BuildContent AI</h1>
<p class="subtitle">All-in-one AI writing platform</p>

<form action="/ai-content-generator" method="GET">
<div class="chat-box">
<textarea placeholder="Ask anything..."></textarea>
<button>↑</button>
</div>
</form>

</div>

</body>
</html>
