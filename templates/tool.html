<!DOCTYPE html>

<html>
<head>
<title>{{ title }}</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

.container {
    max-width:800px;
    margin:100px auto;
    text-align:center;
}

h1 {
    font-size:32px;
    margin-bottom:20px;
}

textarea {
    width:100%;
    height:130px;
    padding:15px;
    border-radius:10px;
    border:none;
    font-size:15px;
}

button {
    margin-top:15px;
    padding:12px 25px;
    background:#3b82f6;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover {
    background:#2563eb;
}

.output {
    margin-top:25px;
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    text-align:left;
    white-space:pre-wrap;
}
</style>

</head>

<body>

<div class="container">

<h1>{{ title }}</h1>

<form method="POST">
<textarea name="prompt" placeholder="Enter your content here..."></textarea>
<br>
<button type="submit">Generate</button>
</form>

<div class="output">
{{ response }}
</div>

</div>

</body>
</html>
