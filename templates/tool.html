<!DOCTYPE html>

<html>
<head>
<title>{{ title }}</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1e293b, #020617);
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#020617;
    border-bottom:1px solid #1e293b;
}

.navbar a {
    color:white;
    text-decoration:none;
    margin-left:20px;
}

/* MAIN */
.container {
    max-width:900px;
    margin:80px auto;
    text-align:center;
}

h1 {
    font-size:40px;
    margin-bottom:10px;
}

.subtitle {
    color:#94a3b8;
    margin-bottom:30px;
}

/* INPUT BOX */
.input-box {
    display:flex;
    align-items:center;
    background:#0f172a;
    border-radius:30px;
    padding:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

textarea {
    flex:1;
    background:transparent;
    border:none;
    color:white;
    padding:15px;
    resize:none;
    outline:none;
}

/* BUTTON */
button {
    background:#7c3aed;
    border:none;
    color:white;
    padding:12px 18px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

/* OUTPUT */
.output {
    margin-top:30px;
    background:#0f172a;
    padding:25px;
    border-radius:15px;
    text-align:left;
    white-space:pre-wrap;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}
</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">
    <div>🚀 BuildContent AI</div>

```
<div>
    <a href="/">Home</a>
    <a href="/ai-content-generator">AI Writer</a>
    <a href="/humanize-ai-text">Humanize</a>
    <a href="/ai-detector-free">Detector</a>
    <a href="/free-seo-writer">SEO</a>
</div>
```

</div>

<!-- MAIN -->

<div class="container">

<h1>{{ title }}</h1>
<p class="subtitle">Generate powerful AI content instantly</p>

<form method="POST">

<div class="input-box">
<textarea name="prompt" placeholder="Type your request..."></textarea>
<button type="submit">↑</button>
</div>

</form>

<div class="output">
{{ response }}
</div>

</div>

</body>
</html>
