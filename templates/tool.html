<!DOCTYPE html>

<html>
<head>
<title>{{ title }}</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI';
    background: radial-gradient(circle at top, #1e293b, #020617);
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#020617;
}

.navbar a {
    color:white;
    text-decoration:none;
    margin-left:20px;
}

/* CHAT AREA */
.chat-container {
    max-width:800px;
    margin:40px auto;
}

/* MESSAGE */
.message {
    padding:15px;
    margin:10px 0;
    border-radius:15px;
    max-width:80%;
    animation:fadeIn 0.3s ease;
}

.user {
    background:#7c3aed;
    margin-left:auto;
}

.bot {
    background:#0f172a;
}

/* INPUT */
.input-box {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:800px;
    max-width:90%;
    background:#0f172a;
    border-radius:40px;
    padding:10px;
    display:flex;
}

textarea {
    flex:1;
    background:transparent;
    border:none;
    color:white;
    padding:15px;
    outline:none;
    resize:none;
}

/* BUTTON */
button {
    background:#7c3aed;
    border:none;
    color:white;
    padding:12px;
    border-radius:50%;
    cursor:pointer;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}
</style>

</head>

<body>

<div class="navbar">
    <div>🚀 BuildContent AI</div>
    <div>
        <a href="/">Home</a>
        <a href="/ai-content-generator">AI Writer</a>
        <a href="/humanize-ai-text">Humanize</a>
    </div>
</div>

<div class="chat-container" id="chat"></div>

<form method="POST" onsubmit="saveMessage()">

<div class="input-box">
<textarea name="prompt" id="input" placeholder="Type your request..."></textarea>
<button>↑</button>
</div>

</form>

<script>

// LOAD HISTORY
window.onload = function() {
    let history = JSON.parse(localStorage.getItem("chat")) || [];
    history.forEach(msg => addMessage(msg.text, msg.type));
}

// ADD MESSAGE
function addMessage(text, type) {
    let div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
}

// SAVE USER MESSAGE
function saveMessage() {
    let input = document.getElementById("input").value;

    if (!input) return;

    addMessage(input, "user");

    let history = JSON.parse(localStorage.getItem("chat")) || [];
    history.push({text: input, type: "user"});
    localStorage.setItem("chat", JSON.stringify(history));
}

// SHOW RESPONSE FROM SERVER
{% if response %}
setTimeout(() => {
    addMessage(`{{ response }}`, "bot");

    let history = JSON.parse(localStorage.getItem("chat")) || [];
    history.push({text: `{{ response }}`, type: "bot"});
    localStorage.setItem("chat", JSON.stringify(history));
}, 500);
{% endif %}

</script>

</body>
</html>
