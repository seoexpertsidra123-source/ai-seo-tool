<!DOCTYPE html>
<html>
<head>
    <title>AI Content Toolkit</title>
    <style>
        body { font-family: Arial; background:#f5f5f5; padding:30px; }
        .container { max-width:800px; margin:auto; background:white; padding:20px; border-radius:10px; }
        .tabs button {
            padding:10px;
            margin:5px;
            border:none;
            background:#ddd;
            cursor:pointer;
        }
        .tabs button.active { background:#333; color:white; }
        textarea { width:100%; padding:10px; margin-top:10px; }
        .output { background:#eee; padding:15px; margin-top:15px; white-space:pre-wrap; }
    </style>
</head>

<body>

<div class="container">
    <h2> AI Content Toolkit</h2>

    <div class="tabs">
        <button onclick="setMode('seo')" class="active">SEO</button>
        <button onclick="setMode('humanize')">Humanize</button>
        <button onclick="setMode('detect')">Detect AI</button>
        <button onclick="setMode('count')">Word Count</button>
        <button onclick="setMode('image')">Image</button>
    </div>

<form method="POST" onsubmit="showLoading()">
            <input type="hidden" name="mode" id="mode" value="seo">
        <textarea name="prompt" rows="6" placeholder="Enter your content..."></textarea>

        <br><br>
        <button type="submit">Generate</button>
    </form>
    <p id="loading" style="display:none;">Generating... ⏳</p>

    <div class="output">
        {{ response }}
    </div>
</div>

<script>
function setMode(value){
    document.getElementById("mode").value = value;

    document.querySelectorAll(".tabs button").forEach(btn=>{
        btn.classList.remove("active");
    });

    event.target.classList.add("active");
}
</script>

</body>
</html>
